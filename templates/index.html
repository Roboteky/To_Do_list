<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to_do_list_app </title>
    <style>

        body{

            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            
            background-color: bisque;
        }

        h1,
        h2{
            text-align: center;
        }

        .input-container{
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;
        }

        #input-todo{

            width: 250px;

            height: 25px;

            font-size: 1.25rem;

        }

        #add-todo{

            height: 40px;

            width: 40px;

            border-radius: 20px;

            border: none;

            background-color: aquamarine;

            font-size: 1.5rem;

            cursor: pointer;


        }

        .todo-container{

          

           width: 80vw;

           margin: auto;
           
           display: flex;

           flex-direction: column;

           gap: 10px;

        }

        .todo {

           background-color: lightblue; 

           display: flex;


           justify-content: space-between;

           align-items: center;

           border-radius: 10px;

           padding: 0px 10px


        }

        .actions>form{

            display: inline;

            align-items: center;

            gap: 10px;
        }

    </style>
</head>
<body>

    <h1>To do list app </h1>
    
    <form action="{{ url_for('home')}} method=" class = 'input-container' >

        <input type="text" placeholder="Enter Todo" id = "input_todo" name=""todo_name">

        <button id = "add-todo"> + </button>

    </form>

    <h2>Todos</h2>

    <div class = "todo-container">
        <div class="todo">

            <p>Write SQL</p>

            <div class="actions">

                <form action="">

                    <input type="checkbox" name="" id="">

                </form>

                <form action="">

                    
                    <button>Delete</button>

                </form>

            </div>

        </div>
        <div class="todo">

            <p>Write SQL</p>

            <div class="actions">

                <form action="">

                    <input type="checkbox" name="" id="">

                </form>

                <form action="">

                    
                    <button>Delete</button>

                </form>

            </div>

        </div>

    </div>
        


    
</body>
</html>
